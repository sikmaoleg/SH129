name: Deploy to SprintHost (FTP)

on:
  push:
    branches:
      - claude/ui-ux-pro-max-skill-setup-chuom5
    paths:
      - 'public_html/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy public_html to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # У SprintHost обычный FTP без TLS на 21 порту — по умолчанию экшен
          # пробует FTPS и зависает на рукопожатии, если сервер его не поддерживает.
          protocol: ftp
          local-dir: ./public_html/
          # Подтверждено через FTP-листинг: реальный докрут сайта — не корень
          # FTP-аккаунта, а domains/sh-129-mg.ru/public_html/.
          server-dir: ./domains/sh-129-mg.ru/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/config/config.php
            **/storage/sessions/**
            README.md
